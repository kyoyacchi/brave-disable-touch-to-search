name: Build module

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package KernelSU module
        run: |
          ZIP="brave-disable-touch-to-search-${GITHUB_REF_NAME}.zip"
          zip -j "$ZIP" module.prop apply.sh action.sh service.sh
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: brave-disable-touch-to-search
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
